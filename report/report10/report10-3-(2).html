<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>10-3</title>
    <script>
        function toSite(){
            var site = document.getElementById('site');
            var url = site.options[site.selectedIndex].value;
            window.open(url,"myWin","width=500,height=400")
        }
    </script>
</head>
<body>
    <hr>
    <h3>접속할 사이트</h3>
    <select id="site" onchange="toSite()">
        <option value="https://www.naver.com/">네이버</option>
        <option value="https://www.google.com/">구글</option>
        <option value="https://www.youtube.com/">유튜브</option>
    </select>
</body>
</html>
